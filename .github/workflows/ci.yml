name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.package }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - iflow-search
          - iflow-search-mcp
          - iflow-search-langchain
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/${{ matrix.package }}/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Typecheck (mypy strict)
        run: python -m mypy src/$(echo "${{ matrix.package }}" | tr - _)

      - name: Tests (pytest)
        run: python -m pytest -q

      - name: Build sdist + wheel
        run: python -m build
